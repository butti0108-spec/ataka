<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lulu SPORTS CONDITIONING SALON 管理画面（サンプル）</title>
<style>
  :root{
    --navy:#1D2C4D; --navy-deep:#131E35; --beige:#F7F1E5; --green:#2B6555;
    --ink:#2B2B28; --muted:#6E6A61; --line:rgba(29,44,77,.16);
    --paper:#FDFBF7; --danger:#A33B2E;
    --jp:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",YuGothic,"Noto Sans JP",sans-serif;
    --serif:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho",YuMincho,"Noto Serif JP",serif;
    --en:"Avenir Next",Avenir,"Century Gothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",YuGothic,"Noto Sans JP",sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:var(--jp); font-size:16px; color:var(--ink); background:#EFE9DC; line-height:1.65; }
  .wrap { max-width:720px; margin:0 auto; background:var(--paper); min-height:100vh; box-shadow:0 0 24px rgba(19,30,53,.10); }
  /* サンプルの帯 */
  .sample-band { background:var(--navy-deep); color:#E9DFC6; font-size:12.5px; letter-spacing:.04em; text-align:center; padding:8px 12px; }
  header { background:var(--navy); color:#fff; padding:20px 20px 16px; }
  header .en { font-family:var(--en); font-size:12px; letter-spacing:.22em; color:#CDBE97; }
  header .ttl { font-family:var(--serif); font-size:23px; font-weight:600; margin-top:4px; }
  header .sub { font-size:13.5px; opacity:.85; margin-top:2px; }
  /* タブ */
  .tabs { display:flex; background:#fff; border-bottom:1px solid var(--line); position:relative; z-index:2; }
  .tabs button { flex:1; padding:14px 4px; font-size:16px; background:none; border:none; cursor:pointer; color:var(--muted); font-family:var(--jp); }
  .tabs button.active { color:var(--navy); font-weight:700; box-shadow:inset 0 -3px 0 var(--green); }
  main { padding:18px 16px 6px; }
  h2.sec { font-family:var(--serif); font-size:19px; color:var(--navy); border-left:4px solid var(--green); padding-left:10px; margin:22px 0 12px; }
  h2.sec:first-child { margin-top:2px; }
  .note { font-size:13.5px; color:var(--muted); }
  .hidden { display:none !important; }
  /* 予約・顧客カード */
  .card { display:block; width:100%; text-align:left; background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px; cursor:pointer; font-family:var(--jp); font-size:16px; color:var(--ink); box-shadow:0 1px 3px rgba(19,30,53,.05); }
  .card:active { background:var(--beige); }
  .card.open { border-color:var(--navy); box-shadow:0 0 0 1px var(--navy); }
  .card.cancelled { opacity:.6; }
  .card .row1 { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .card .tm { font-family:var(--en); font-size:17px; font-weight:700; color:var(--navy); font-variant-numeric:tabular-nums; }
  .card .nm { font-size:17px; font-weight:700; margin-top:2px; }
  .card .ds { font-size:14.5px; color:#44413C; margin-top:1px; }
  .card .sub2 { font-size:13.5px; color:var(--muted); margin-top:1px; }
  .chip { display:inline-block; font-size:12px; font-weight:700; border-radius:999px; padding:2px 11px; white-space:nowrap; }
  .chip.st-ok { background:rgba(29,44,77,.08); color:var(--navy); border:1px solid rgba(29,44,77,.35); }
  .chip.st-done { background:var(--green); color:#fff; }
  .chip.st-cancel { background:#F3E7E1; color:var(--danger); border:1px solid rgba(163,59,46,.35); }
  /* 詳細アコーディオン */
  .acc { overflow:hidden; height:0; }
  .detail { border:1.5px solid var(--navy); border-radius:14px; background:#fff; padding:18px 16px 16px; margin:2px 0 12px; }
  .detail .d-name { font-family:var(--serif); font-size:21px; font-weight:600; color:var(--navy-deep); }
  .detail .d-kana { font-size:13px; color:var(--muted); margin-left:8px; }
  .d-sec { margin-top:18px; }
  .d-sec:first-of-type { margin-top:14px; }
  .d-label { font-size:12.5px; font-weight:700; letter-spacing:.12em; color:var(--green); border-bottom:1px solid var(--line); padding-bottom:5px; margin-bottom:10px; }
  .kv { font-size:15px; }
  .kv .k { color:var(--muted); font-size:13.5px; }
  .lastbox { background:var(--beige); border-radius:10px; padding:12px 14px; }
  .lastbox .lb-t { font-size:13px; color:var(--navy); font-weight:700; }
  .lastbox .lb-v { font-size:16px; font-weight:700; margin-top:2px; }
  .lastbox .lb-m { font-size:14.5px; margin-top:6px; color:#44413C; }
  .hist { border-top:1px solid var(--line); padding:9px 0; }
  .hist:first-of-type { border-top:none; }
  .hist .hd { font-size:13.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .hist .hc { font-size:15px; }
  .hist .hm { font-size:14px; color:#44413C; margin-top:3px; background:#F7F4EC; border-radius:8px; padding:8px 10px; }
  /* ボタン */
  .btn { display:block; width:100%; padding:14px; font-size:16px; font-weight:700; border:none; border-radius:12px; background:var(--navy); color:#fff; cursor:pointer; font-family:var(--jp); }
  .btn.green { background:var(--green); }
  .btn.sub { background:#fff; color:var(--navy); border:1.5px solid var(--navy); }
  .btn.danger { background:#fff; color:var(--danger); border:1.5px solid var(--danger); }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn.sm { padding:12px; font-size:15px; }
  .btnrow { display:flex; gap:10px; }
  .btnrow .btn { flex:1; }
  /* フォーム */
  label.fl { display:block; font-weight:700; font-size:14.5px; margin:14px 0 6px; }
  label.fl:first-child { margin-top:2px; }
  input.fi, textarea.fi { width:100%; padding:12px; font-size:16px; border:1.5px solid #CBD2DC; border-radius:10px; background:#fff; font-family:var(--jp); color:var(--ink); }
  textarea.fi { min-height:104px; line-height:1.6; }
  input.fi:focus, textarea.fi:focus { outline:2px solid rgba(43,101,85,.45); outline-offset:0; border-color:var(--green); }
  /* 音声入力 */
  .mic-row { display:flex; gap:10px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  .mic { display:inline-flex; align-items:center; gap:8px; padding:11px 18px; font-size:15px; font-weight:700; border:none; border-radius:999px; background:var(--navy); color:#fff; cursor:pointer; font-family:var(--jp); }
  .mic .dot { width:10px; height:10px; border-radius:50%; background:#fff; opacity:.85; }
  .mic.rec { background:var(--danger); }
  .mic.rec .dot { background:#fff; animation:blink 1s infinite; }
  .mic:disabled { opacity:.5; cursor:default; }
  @keyframes blink { 50% { opacity:.25; } }
  /* 確認（インライン） */
  .confirm-box { background:#FDF6EC; border:1px solid #E3C98F; border-radius:10px; padding:12px 14px; margin-top:10px; }
  .confirm-box p { font-size:14.5px; margin-bottom:10px; }
  /* お知らせ（失敗時のみ） */
  .notice { border-radius:10px; padding:12px 14px; font-size:14.5px; margin-bottom:12px; display:flex; gap:10px; align-items:flex-start; }
  .notice.retry { background:#FFF7E2; border:1px solid #DFB54E; color:#6B5310; }
  .notice.fatal { background:#FBEAE6; border:1px solid #D89A8C; color:#7C2D1E; }
  .notice .n-act { margin-left:auto; flex-shrink:0; }
  .notice button { background:none; border:none; font-weight:700; font-size:14.5px; cursor:pointer; color:inherit; text-decoration:underline; font-family:var(--jp); padding:0; }
  footer { padding:20px 16px 28px; text-align:center; font-size:13px; color:var(--muted); }
  @media (max-width:480px){ .tabs button{ font-size:15px; } header .ttl{ font-size:21px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="sample-band">サンプル画面です｜表示されているお客様・予約は、すべて実在しないサンプルデータです</div>
  <header>
    <div class="en">lulu SPORTS CONDITIONING SALON</div>
    <div class="ttl">管理画面</div>
    <div class="sub">安宅さん用｜予約・カルテ・お客様の管理</div>
  </header>

  <nav class="tabs">
    <button type="button" id="tab-today" class="active">今日の予約</button>
    <button type="button" id="tab-cust">顧客リスト</button>
  </nav>

  <!-- ============ 今日の予約 ============ -->
  <main id="view-today">
    <h2 class="sec">今日の予約</h2>
    <p class="note" id="today-label"></p>
    <p class="note" style="margin-top:4px;">予約をタップすると、その予約のカルテとお客様の詳細が開きます。</p>
    <div id="today-list" style="margin-top:12px;"></div>
  </main>

  <!-- ============ 顧客リスト ============ -->
  <main id="view-cust" class="hidden">
    <h2 class="sec">顧客リスト</h2>
    <p class="note">お客様をタップすると、基本情報・来店履歴・カルテが開きます。</p>
    <input class="fi" id="cust-search" type="text" placeholder="名前・カナ・電話番号・メールで検索" style="margin-top:10px;">
    <div id="cust-list" style="margin-top:12px;"></div>
    <p class="note hidden" id="cust-noresult" style="margin-top:6px;">該当するお客様がいません</p>
  </main>

  <!-- ============ 詳細（共通アコーディオン） ============ -->
  <div id="detail-acc" class="acc">
    <div class="acc-inner">
      <div class="detail" id="detail-panel"></div>
    </div>
  </div>

  <footer>lulu SPORTS CONDITIONING SALON 管理画面（サンプル）<br>この画面は試作品です。保存した内容は、この画面の中だけに反映されます。</footer>
</div>

<script>
/* ================= サンプルデータ（実システムでは台帳スプレッドシートと連携する構造） ================= */
const COURSES = [

const CUSTOMERS = [

    profile:"会社員。デスクワーク中心。慢性的に首・肩が重い。月1回ペース希望。",

      { date:"2026-10-10", courseId:"c4", karte:"右肩の巻き込みが目立つ。胸郭の動きを出す施術を実施。" },

  { id:"u2", name:"佐藤 健一", kana:"サトウ ケンイチ", tel:"090-0000-2222", mail:"kenichi@example.jp",
    profile:"週末にランニング。腰の張りが出やすい。大会前の調整で来店。",

    visits:[

      { date:"2026-09-25", courseId:"c1", karte:"初回。フルマラソン前の全身調整。股関節の可動域に左右差あり。" }

  { id:"u3", name:"鈴木 美香", kana:"スズキ ミカ", tel:"090-0000-3333", mail:"mika@example.jp",

    firstVisit:"2026-10-15",
    visits:[
      { date:"2026-11-05", courseId:"c4", karte:"右腕の疲労と腰の重さ。本人はポイントケアで十分に楽になるとのこと。" },
      { date:"2026-10-15", courseId:"c4", karte:"初回。抱っこの負担で右前腕と腰に張り。施術後は軽くなったと笑顔。" }
    ] },
  { id:"u4", name:"田中 翔太", kana:"タナカ ショウタ", tel:"090-0000-4444", mail:"shota@example.jp",
    profile:"学生アスリート（サッカー）。練習後のケアと怪我予防。※レゼルバからの移行データ",
    firstVisit:"2026-10-30", migrated:true,
    visits:[
      { date:"2026-10-30", courseId:"c1", karte:"太もも裏の張り。体験コースで全身調整＋自宅エクササイズ提案済み。" }
    ] },
  { id:"u5", name:"高橋 さくら", kana:"タカハシ サクラ", tel:"090-0000-5555", mail:"sakura@example.jp",
    profile:"美容鍼が目的。肌のくすみと眼精疲労が気になる。",
    firstVisit:"2026-09-18",
    visits:[
      { date:"2026-10-31", courseId:"c7", karte:"美容鍼スタンダード50本。施術後は血色が良くなったと実感。次回はプレミアムも検討。" },
      { date:"2026-09-18", courseId:"c8", karte:"初回。美容鍼トライアル20本。鍼への不安が強かったが、問題なく終了。" }
    ] }
];
/* 今日の予約（日付は表示時に「今日」として扱う） */
const BOOKINGS = [
  { id:"b1", time:"09:00", customerId:"u4", courseId:"c5", status:"キャンセル", karte:"" },
  { id:"b2", time:"10:00", customerId:"u1", courseId:"c4", status:"来店済み",
    opts:[{name:"鍼治療（BODY）", price:2000}],
    karte:"首肩まわりの緊張が強い。前回より可動域は改善。骨盤まわりも確認し、左の張りが残る。次回は骨盤中心に。" },
  { id:"b3", time:"11:30", customerId:"u2", courseId:"c2", status:"確定", memo:"腰を重点的にお願いします", karte:"" },
  { id:"b4", time:"14:00", customerId:"u3", courseId:"c4", status:"確定", karte:"" },
  { id:"b5", time:"16:00", customerId:"u5", courseId:"c6", status:"確定", karte:"" },
  { id:"b6", time:"18:30", customerId:"u1", courseId:"c2", status:"確定", demoGlitch:true, karte:"" }
];

/* ================= 共通ユーティリティ ================= */
const DOW = ["日","月","火","水","木","金","土"];
function fmtDate(d){ return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日（"+DOW[d.getDay()]+"）"; }
function fmtDay(s){ const p=s.split("-"); return Number(p[1])+"月"+Number(p[2])+"日"; }
function fmtPrice(n){ return "¥"+n.toLocaleString("ja-JP"); }
function courseById(id){ return COURSES.find(c=>c.id===id); }
function custById(id){ return CUSTOMERS.find(c=>c.id===id); }
function bookingById(id){ return BOOKINGS.find(b=>b.id===id); }
function endTime(start, minutes){
  const [h,m] = start.split(":").map(Number);
  const t = h*60+m+minutes;
  return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");
}
function bookingTotal(bk){
  const co = courseById(bk.courseId);
  return co.price + (bk.opts ? bk.opts.reduce((s,o)=>s+o.price,0) : 0);
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function chipHtml(st){
  if (st==="来店済み") return '<span class="chip st-done">来店済み</span>';
  if (st==="キャンセル") return '<span class="chip st-cancel">キャンセル</span>';
  return '<span class="chip st-ok">確定</span>';
}

/* ================= 疑似API（実システムでは台帳への保存に置き換わる部分） =================
   ・通常は少し待って成功する。
   ・サンプルデータ内の b6 は「通信が不安定な想定」で、状態変更の1回目だけ失敗する（再試行で成功）。
   ・移行データ（migrated）の顧客情報の編集は、保護のため失敗する（制作者連絡系）。 */
const apiState = { glitchUsed:false };
function fakeApi(kind, payload){
  return new Promise((resolve, reject)=>{
    setTimeout(()=>{
      if (kind==="status" && payload.bookingId==="b6" && !apiState.glitchUsed){
        apiState.glitchUsed = true;
        reject({ kind:"retry", message:"変更を保存できませんでした。通信状態をご確認のうえ、もう一度お試しください。" });
        return;
      }
      if (kind==="customer"){
        const cu = custById(payload.customerId);
        if (cu && cu.migrated){
          reject({ kind:"fatal", message:"このお客様の情報は、移行元のデータと連携しているため、この画面では変更できません。制作者にご連絡ください。" });
          return;
        }
      }
      resolve({ ok:true });
    }, 300);
  });
}

/* ================= タブ ================= */
let currentTab = "today";
const accEl = document.getElementById("detail-acc");
document.getElementById("tab-today").addEventListener("click", ()=>showTab("today"));
document.getElementById("tab-cust").addEventListener("click", ()=>showTab("cust"));
document.getElementById("cust-search").addEventListener("input", filterCustomers);
function showTab(name){
  currentTab = name;
  stopMic();
  hardResetDetail();
  ["today","cust"].forEach(t=>{
    document.getElementById("view-"+t).classList.toggle("hidden", t!==name);
    document.getElementById("tab-"+t).classList.toggle("active", t===name);
  });
  glideToTop();
}
let glideTimer = null;
function glideToTop(){
  const startY = window.scrollY;
  if (startY < 4){ window.scrollTo(0,0); return; }
  const t0 = performance.now(), dur = 420;
  clearInterval(glideTimer);
  glideTimer = setInterval(()=>{
    const p = Math.min(1, (performance.now() - t0) / dur);
    const e = p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2) / 2;
    window.scrollTo(0, startY * (1 - e));
    if (p >= 1) clearInterval(glideTimer);
  }, 16);
}

/* ================= 一覧の描画 ================= */
function renderToday(){
  const today = new Date();
  document.getElementById("today-label").textContent = fmtDate(today)+" のご予約は "+BOOKINGS.length+" 件です。";
  const box = document.getElementById("today-list");
  if (box.contains(accEl)) document.getElementById("view-today").after(accEl); /* 再描画で詳細が消えないよう救出 */
  box.innerHTML = "";
  BOOKINGS.slice().sort((a,b)=>a.time<b.time?-1:1).forEach(bk=>{
    const cu = custById(bk.customerId), co = courseById(bk.courseId);
    const b = document.createElement("button");
    b.className = "card" + (bk.status==="キャンセル" ? " cancelled" : "");
    b.dataset.bookingId = bk.id;
    let html = '<span class="row1"><span class="tm">'+bk.time+"〜"+endTime(bk.time, co.minutes)+'</span>'+chipHtml(bk.status)+'</span>'
      + '<span class="nm">'+esc(cu.name)+' 様</span><br>'
      + '<span class="ds">'+esc(co.name)+'（'+co.minutes+'分／'+fmtPrice(bookingTotal(bk))+'）</span>';
    if (bk.opts) html += '<br><span class="sub2">オプション：'+bk.opts.map(o=>esc(o.name)).join("、")+'（+'+fmtPrice(bk.opts.reduce((s,o)=>s+o.price,0))+'）</span>';
    if (bk.memo) html += '<br><span class="sub2">ご要望：'+esc(bk.memo)+'</span>';
    b.innerHTML = html;
    b.addEventListener("click", ()=>openDetail({ type:"booking", bookingId:bk.id }, b));
    box.appendChild(b);
  });
}
function renderCustList(list){
  const cl = document.getElementById("cust-list");
  if (cl.contains(accEl)) document.getElementById("view-cust").after(accEl); /* 再描画で詳細が消えないよう救出 */
  cl.innerHTML = "";
  list.forEach(cu=>{
    const last = cu.visits[0];
    const b = document.createElement("button");
    b.className = "card";
    b.dataset.customerId = cu.id;
    b.innerHTML = '<span class="nm">'+esc(cu.name)+' 様</span><br>'
      + '<span class="sub2">前回：'+last.date.replace(/-/g,"/")+" ／ "+esc(courseById(last.courseId).name)+'（来店 '+cu.visits.length+' 回）</span>';
    b.addEventListener("click", ()=>openDetail({ type:"customer", customerId:cu.id }, b));
    cl.appendChild(b);
  });
  document.getElementById("cust-noresult").classList.toggle("hidden", list.length > 0);
}
function filterCustomers(){
  if (openCtx && openCtx.type === "customer") hardResetDetail(); /* 検索し直したら詳細は閉じる */
  const q = document.getElementById("cust-search").value.trim();
  if (!q){ renderCustList(CUSTOMERS); return; }
  const qk = q.replace(/[ぁ-ゖ]/g, s=>String.fromCharCode(s.charCodeAt(0)+0x60));
  const ql = q.toLowerCase();
  const digits = q.replace(/\D/g, "");
  renderCustList(CUSTOMERS.filter(cu=>{
    if (cu.name.includes(q)) return true;
    if (cu.kana && cu.kana.includes(qk)) return true;
    if (cu.mail.toLowerCase().includes(ql)) return true;
    if (digits && cu.tel.replace(/\D/g, "").includes(digits)) return true;
    return false;
  }));
}

/* ================= アコーディオン（最終形の動き） =================
   開く時：タップした行が画面の一番上へ上がりながら、その真下で開く（1つの連続動作・行は上方向にだけ動く）。
   閉じる時：まず画面だけを一番上まで滑らせ、止まってから畳む（一度に動かすのは一つだけ）。 */
let openCtx = null;        // { type, bookingId?, customerId }
let openAnchor = null;     // 開いているカード要素
let animSeq = 0;           // 連続タップで古いアニメーションを打ち切るための番号
let animating = false;

function hardResetDetail(){
  animSeq++;
  animating = false;
  openCtx = null;
  if (openAnchor) openAnchor.classList.remove("open");
  openAnchor = null;
  stopMic();
  accEl.style.height = "0px";
}

function openDetail(ctx, anchor){
  if (animating) return;
  if (openAnchor === anchor){ closeDetail(); return; }
  const seq = ++animSeq;
  stopMic();
  if (openAnchor) openAnchor.classList.remove("open");
  openCtx = ctx;
  openAnchor = anchor;
  anchor.classList.add("open");
  buildDetail(ctx);
  anchor.after(accEl);
  const inner = accEl.firstElementChild;
  accEl.style.height = "0px";
  const targetH = inner.offsetHeight;
  const anchorDocTop = anchor.getBoundingClientRect().top + window.scrollY;
  const startY = window.scrollY;
  if (Math.abs(anchor.getBoundingClientRect().top) < 8 || startY === anchorDocTop){
    animating = true;
    const t0 = performance.now(), dur = 380;
    (function step(now){
      if (seq !== animSeq) return;
      const p = Math.min(1, (now - t0) / dur);
      accEl.style.height = (targetH * easeInOut(p)) + "px";
      if (p < 1) requestAnimationFrame(step);
      else { accEl.style.height = "auto"; animating = false; }
    })(t0);
    return;
  }
  animating = true;
  const t0 = performance.now(), dur = 540;
  (function step(now){
    if (seq !== animSeq) return;
    const p = Math.min(1, (now - t0) / dur);
    const e = easeInOut(p);
    accEl.style.height = (targetH * e) + "px";
    const maxY = document.documentElement.scrollHeight - window.innerHeight;
    window.scrollTo(0, Math.min(startY + (anchorDocTop - startY) * e, maxY));
    if (p < 1) requestAnimationFrame(step);
    else { accEl.style.height = "auto"; animating = false; }
  })(t0);
}

function closeDetail(){
  if (!openAnchor || animating) return;
  const seq = ++animSeq;
  stopMic();
  if (openAnchor) openAnchor.classList.remove("open");
  openCtx = null;
  const anchor = openAnchor;
  openAnchor = null;
  const collapse = ()=>{
    if (seq !== animSeq) return;
    animating = true;
    accEl.style.height = accEl.offsetHeight + "px";
    void accEl.offsetHeight;
    const from = accEl.offsetHeight, t0 = performance.now(), dur = 320;
    (function step(now){
      if (seq !== animSeq) return;
      const p = Math.min(1, (now - t0) / dur);
      accEl.style.height = (from * (1 - easeInOut(p))) + "px";
      if (p < 1) requestAnimationFrame(step);
      else { accEl.style.height = "0px"; animating = false; }
    })(t0);
  };
  /* 閉じる時は、まず画面だけを一番上まで滑らせる（この間、詳細は畳まない） */
  const startY = window.scrollY;
  if (startY < 4){ collapse(); return; }
  animating = true;
  const t0 = performance.now(), dur = 460;
  (function step(now){
    if (seq !== animSeq) return;
    const p = Math.min(1, (now - t0) / dur);
    window.scrollTo(0, startY * (1 - easeInOut(p)));
    if (p < 1) requestAnimationFrame(step);
    else { animating = false; collapse(); }
  })(t0);
}
function easeInOut(p){ return p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2) / 2; }

/* ================= 詳細の中身 ================= */
function karteTarget(ctx){
  /* カルテの記入対象：予約から開いた時はその予約、顧客から開いた時は前回の来店 */
  if (ctx.type === "booking"){
    const bk = bookingById(ctx.bookingId);
    return { label:"今回のカルテ", dateLabel:"本日 "+bk.time+"〜の施術メモ", get:()=>bk.karte, set:v=>{ bk.karte = v; } };
  }
  const cu = custById(ctx.customerId);
  const v = cu.visits[0];
  return { label:"前回（"+fmtDay(v.date)+"）のカルテ", dateLabel:fmtDay(v.date)+" の施術メモ", get:()=>v.karte, set:val=>{ v.karte = val; } };
}

function buildDetail(ctx){
  const panel = document.getElementById("detail-panel");
  const cu = custById(ctx.type === "booking" ? bookingById(ctx.bookingId).customerId : ctx.customerId);
  const kt = karteTarget(ctx);
  let html = '<div id="detail-notice"></div>';
  html += '<div><span class="d-name">'+esc(cu.name)+' 様</span><span class="d-kana">'+esc(cu.kana)+'</span></div>';

  if (ctx.type === "booking"){
    const bk = bookingById(ctx.bookingId);
    const co = courseById(bk.courseId);
    html += '<div class="d-sec"><div class="d-label">この予約</div>'
      + '<p class="kv"><span class="k">日時：</span>本日 '+bk.time+"〜"+endTime(bk.time, co.minutes)+'<br>'
      + '<span class="k">コース：</span>'+esc(co.name)+'（'+co.minutes+'分）<br>'
      + '<span class="k">料金：</span>'+fmtPrice(bookingTotal(bk))
      + (bk.opts ? '（コース '+fmtPrice(co.price)+'＋オプション '+fmtPrice(bk.opts.reduce((s,o)=>s+o.price,0))+'）' : '')
      + '<br><span class="k">状態：</span><span id="d-status-chip">'+chipHtml(bk.status)+'</span>'
      + (bk.memo ? '<br><span class="k">ご要望：</span>'+esc(bk.memo) : '')
      + '</p>'
      + '<div id="status-area" style="margin-top:12px;">'+statusButtonsHtml(bk)+'</div>'
      + '</div>';
  }

  /* カルテ */
  html += '<div class="d-sec"><div class="d-label">カルテ</div>'
    + '<label class="fl" for="karte-memo">'+esc(kt.label)+'（'+esc(kt.dateLabel)+'）</label>'
    + '<textarea class="fi" id="karte-memo" placeholder="施術内容・状態・次回の注意点など">'+esc(kt.get())+'</textarea>'
    + '<div class="mic-row"><button class="mic" id="mic-btn" type="button"><span class="dot"></span><span id="mic-label">音声で入力</span></button>'
    + '<span class="note" id="mic-status">ボタンを押して話すと、声が文字になってメモに入ります。</span></div>'
    + '<div class="btnrow" style="margin-top:12px;"><button class="btn sm" id="karte-save" type="button">カルテを保存する</button></div>'
    + '</div>';

  /* 前回の施術（予約から開いた時だけ、カルテ対象と別のものとして表示） */
  if (ctx.type === "booking" && cu.visits.length){
    const last = cu.visits[0];
    const lc = courseById(last.courseId);
    html += '<div class="d-sec"><div class="d-label">前回の施術</div>'
      + '<div class="lastbox"><div class="lb-t">'+last.date.replace(/-/g,"/")+'（前回）</div>'
      + '<div class="lb-v">'+esc(lc.name)+'（'+lc.minutes+'分）</div>'
      + (last.karte ? '<div class="lb-m">'+esc(last.karte)+'</div>' : '')
      + '</div></div>';
  }

  /* 来店履歴 */
  html += '<div class="d-sec"><div class="d-label">来店履歴（'+cu.visits.length+'回）</div>';
  cu.visits.forEach(v=>{
    const co = courseById(v.courseId);
    html += '<div class="hist"><span class="hd">'+v.date.replace(/-/g,"/")+'</span>　<span class="hc">'+esc(co.name)+'（'+co.minutes+'分／'+fmtPrice(co.price)+'）</span>'
      + (v.karte ? '<div class="hm">'+esc(v.karte)+'</div>' : '')
      + '</div>';
  });
  html += '</div>';

  /* お客様の基本情報 */
  html += '<div class="d-sec"><div class="d-label">お客様の基本情報</div><div id="cust-view">'
    + '<p class="kv"><span class="k">電話：</span>'+esc(cu.tel)+'<br>'
    + '<span class="k">メール：</span>'+esc(cu.mail)+'<br>'
    + '<span class="k">初回：</span>'+cu.firstVisit.replace(/-/g,"/")+'<br>'
    + '<span class="k">プロフィール：</span>'+esc(cu.profile)+'</p>'
    + '<div class="btnrow" style="margin-top:12px;"><button class="btn sub sm" id="cust-edit-open" type="button">基本情報を編集する</button></div>'
    + '</div><div id="cust-edit" class="hidden">'
    + '<label class="fl" for="f-name">お名前</label><input class="fi" id="f-name" type="text" value="'+esc(cu.name)+'">'
    + '<label class="fl" for="f-kana">カナ</label><input class="fi" id="f-kana" type="text" value="'+esc(cu.kana)+'">'
    + '<label class="fl" for="f-tel">電話番号</label><input class="fi" id="f-tel" type="tel" value="'+esc(cu.tel)+'">'
    + '<label class="fl" for="f-mail">メールアドレス</label><input class="fi" id="f-mail" type="email" value="'+esc(cu.mail)+'">'
    + '<label class="fl" for="f-profile">プロフィール</label><textarea class="fi" id="f-profile">'+esc(cu.profile)+'</textarea>'
    + '<div class="btnrow" style="margin-top:14px;"><button class="btn sm" id="cust-save" type="button">保存する</button>'
    + '<button class="btn sub sm" id="cust-edit-cancel" type="button">編集をやめる</button></div>'
    + '</div></div>';

  html += '<div class="btnrow" style="margin-top:20px;"><button class="btn sub" id="detail-close" type="button">一覧に戻る</button></div>';
  panel.innerHTML = html;

  /* --- イベント配線 --- */
  document.getElementById("detail-close").addEventListener("click", closeDetail);
  document.getElementById("karte-save").addEventListener("click", saveKarte);
  document.getElementById("cust-edit-open").addEventListener("click", ()=>{
    document.getElementById("cust-view").classList.add("hidden");
    document.getElementById("cust-edit").classList.remove("hidden");
    refreshAccHeight();
  });
  document.getElementById("cust-edit-cancel").addEventListener("click", ()=>{
    document.getElementById("cust-edit").classList.add("hidden");
    document.getElementById("cust-view").classList.remove("hidden");
    refreshAccHeight();
  });
  document.getElementById("cust-save").addEventListener("click", saveCustomer);
  wireStatusButtons();
  setupMic();
}
function refreshAccHeight(){
  /* 詳細が開き切った後（height:auto）では不要。アニメーション中だけ高さを追随させる */
  if (!animating && accEl.style.height !== "auto") return;
}

/* ================= 状態変更 ================= */
function statusButtonsHtml(bk){
  if (bk.status === "確定"){
    return '<div class="btnrow"><button class="btn green sm" data-act="done" type="button">来店済みにする</button>'
      + '<button class="btn danger sm" data-act="cancel-ask" type="button">キャンセルする</button></div>';
  }
  if (bk.status === "来店済み"){
    return '<div class="btnrow"><button class="btn sub sm" data-act="revert" type="button">確定に戻す（来店済みを取り消す）</button></div>';
  }
  return '<div class="btnrow"><button class="btn sub sm" data-act="revert" type="button">確定に戻す（キャンセルを取り消す）</button></div>';
}
function wireStatusButtons(){
  const area = document.getElementById("status-area");
  if (!area) return;
  area.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const act = btn.dataset.act;
      const bk = bookingById(openCtx.bookingId);
      if (act === "cancel-ask"){
        area.innerHTML = '<div class="confirm-box"><p>この予約をキャンセルしますか？<br>キャンセルすると、その時間の枠は空きに戻ります。</p>'
          + '<div class="btnrow"><button class="btn danger sm" data-act="cancel-do" type="button">キャンセルを確定する</button>'
          + '<button class="btn sub sm" data-act="cancel-back" type="button">やめる</button></div></div>';
        wireStatusButtons();
        return;
      }
      if (act === "cancel-back"){
        area.innerHTML = statusButtonsHtml(bk);
        wireStatusButtons();
        return;
      }
      const next = act === "done" ? "来店済み" : act === "cancel-do" ? "キャンセル" : "確定";
      changeStatus(bk, next, btn);
    });
  });
}
let statusBusy = false;
function changeStatus(bk, next, btn){
  if (statusBusy) return;               /* 二度押し対策 */
  statusBusy = true;
  const area = document.getElementById("status-area");
  const original = area.innerHTML;
  area.querySelectorAll("button").forEach(b=>{ b.disabled = true; });
  if (btn) btn.textContent = "保存中…";
  fakeApi("status", { bookingId: bk.id }).then(()=>{
    bk.status = next;
    statusBusy = false;
    clearNotice();
    document.getElementById("d-status-chip").innerHTML = chipHtml(next);
    area.innerHTML = statusButtonsHtml(bk);
    wireStatusButtons();
    renderToday();                       /* 一覧のチップ・見た目にも静かに反映 */
    rebindOpenCard();
  }).catch(err=>{
    statusBusy = false;
    area.innerHTML = original;
    wireStatusButtons();
    showNotice(err, ()=>{ const b = document.querySelector('#status-area button[data-act="'+(next==="来店済み"?"done":next==="キャンセル"?"cancel-do":"revert")+'"]'); if (b) changeStatus(bk, next, b); });
  });
}
function rebindOpenCard(){
  /* 一覧を再描画した後、開いているカードの参照を新しい要素に付け替える */
  if (!openCtx) return;
  let el = null;
  if (openCtx.type === "booking") el = document.querySelector('#today-list .card[data-booking-id="'+openCtx.bookingId+'"]');
  if (openCtx.type === "customer") el = document.querySelector('#cust-list .card[data-customer-id="'+openCtx.customerId+'"]');
  if (el){
    if (openAnchor && openAnchor !== el) openAnchor.classList.remove("open");
    openAnchor = el;
    el.classList.add("open");
    el.after(accEl);
  }
}

/* ================= お知らせ（失敗した時だけ・2種） ================= */
function showNotice(err, retryFn){
  const box = document.getElementById("detail-notice");
  if (!box) return;
  const cls = err.kind === "fatal" ? "fatal" : "retry";
  box.innerHTML = '<div class="notice '+cls+'"><span>'+esc(err.message)+'</span><span class="n-act">'
    + (err.kind === "fatal" || !retryFn
        ? '<button type="button" id="notice-close">閉じる</button>'
        : '<button type="button" id="notice-retry">もう一度試す</button>')
    + '</span></div>';
  const close = document.getElementById("notice-close");
  if (close) close.addEventListener("click", clearNotice);
  const retry = document.getElementById("notice-retry");
  if (retry) retry.addEventListener("click", ()=>{ clearNotice(); retryFn(); });
}
function clearNotice(){
  const box = document.getElementById("detail-notice");
  if (box) box.innerHTML = "";
}

/* ================= カルテ保存 ================= */
let karteBusy = false;
function saveKarte(){
  if (karteBusy || !openCtx) return;
  karteBusy = true;
  const btn = document.getElementById("karte-save");
  const kt = karteTarget(openCtx);
  const val = document.getElementById("karte-memo").value;
  btn.disabled = true;
  btn.textContent = "保存中…";
  fakeApi("karte", { bookingId: openCtx.bookingId || "" }).then(()=>{
    kt.set(val);
    karteBusy = false;
    clearNotice();
    btn.disabled = false;
    btn.textContent = "保存しました";
    setTimeout(()=>{ if (btn.isConnected) btn.textContent = "カルテを保存する"; }, 1600);
    /* 来店履歴の表示にも静かに反映する */
    const cu = custById(openCtx.type === "booking" ? bookingById(openCtx.bookingId).customerId : openCtx.customerId);
    if (openCtx.type === "customer") buildDetailKeepScroll(openCtx);
    else if (cu) { /* 予約文脈では履歴は前回分のみ別枠表示のため再描画しない */ }
  }).catch(err=>{
    karteBusy = false;
    btn.disabled = false;
    btn.textContent = "カルテを保存する";
    showNotice(err, saveKarte);
  });
}
function buildDetailKeepScroll(ctx){
  const y = window.scrollY;
  buildDetail(ctx);
  window.scrollTo(0, y);
}

/* ================= 顧客情報の保存 ================= */
let custBusy = false;
function saveCustomer(){
  if (custBusy || !openCtx) return;
  custBusy = true;
  const btn = document.getElementById("cust-save");
  const cu = custById(openCtx.type === "booking" ? bookingById(openCtx.bookingId).customerId : openCtx.customerId);
  const data = {
    customerId: cu.id,
    name: document.getElementById("f-name").value,
    kana: document.getElementById("f-kana").value,
    tel: document.getElementById("f-tel").value,
    mail: document.getElementById("f-mail").value,
    profile: document.getElementById("f-profile").value
  };
  btn.disabled = true;
  btn.textContent = "保存中…";
  fakeApi("customer", data).then(()=>{
    Object.assign(cu, { name:data.name, kana:data.kana, tel:data.tel, mail:data.mail, profile:data.profile });
    custBusy = false;
    clearNotice();
    document.getElementById("cust-search").value = "";
    renderToday();
    renderCustList(CUSTOMERS);
    buildDetail(openCtx);
    rebindOpenCard();
  }).catch(err=>{
    custBusy = false;
    btn.disabled = false;
    btn.textContent = "保存する";
    showNotice(err, null);
  });
}

/* ================= 音声入力（Web Speech API） ================= */
let recog = null, recognizing = false;
function stopMic(){
  if (recog && recognizing){ try{ recog.stop(); }catch(e){} }
  recognizing = false;
  const btn = document.getElementById("mic-btn");
  if (btn){ btn.classList.remove("rec"); }
  const lbl = document.getElementById("mic-label");
  if (lbl) lbl.textContent = "音声で入力";
}
function setupMic(){
  const btn = document.getElementById("mic-btn");
  const status = document.getElementById("mic-status");
  if (!btn) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){
    btn.disabled = true;
    status.textContent = "この端末・ブラウザでは音声入力に対応していません。キーボードのマイク入力をご利用ください。";
    return;
  }
  recog = new SR();
  recog.lang = "ja-JP";
  recog.interimResults = false;
  recog.continuous = false;
  recog.onresult = (ev)=>{
    let text = "";
    for (let i=ev.resultIndex; i<ev.results.length; i++){ text += ev.results[i][0].transcript; }
    const memo = document.getElementById("karte-memo");
    memo.value += (memo.value && !memo.value.endsWith("。") && !memo.value.endsWith("\n") ? "。" : "") + text;
    status.textContent = "入力しました。続けて話す場合は、もう一度ボタンを押してください。";
  };
  recog.onerror = ()=>{ stopMic(); status.textContent = "うまく聞き取れませんでした。もう一度お試しください。"; };
  recog.onend = ()=>{ stopMic(); };
  btn.addEventListener("click", ()=>{
    if (recognizing){ stopMic(); status.textContent = "止めました。"; return; }
    try{
      recog.start();
      recognizing = true;
      btn.classList.add("rec");
      document.getElementById("mic-label").textContent = "録音中…（押すと止まります）";
      status.textContent = "聞き取り中です。カルテの内容を話してください。";
    }catch(e){
      status.textContent = "音声入力を開始できませんでした。";
    }
  });
}

/* ================= 初期表示 ================= */
renderToday();
renderCustList(CUSTOMERS);
